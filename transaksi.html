<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRANSAKSI - SECOND CHANCE</title>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Helvetica Neue", sans-serif;
    background: #fff;
    color: #111;
    padding-top: 80px;
}

header {
    position: fixed; top: 0; width: 100%;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #eee;
    z-index: 1000;
}

.nav-container {
    display: flex; justify-content: space-between;
    align-items: center; padding: 20px;
}

.logo { display: flex; align-items: center; gap: 10px; }
.logo img { width: 30px; }
.logo h1 { font-size: 16px; letter-spacing: 3px; }

nav { display: flex; gap: 20px; }
nav a {
    text-decoration: none; color: #111;
    font-size: 13px; letter-spacing: 1px; transition: 0.3s;
}
nav a:hover { opacity: 0.5; }

section.hero {
    height: 70vh;
    background:
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url('https://plus.unsplash.com/premium_photo-1745928774672-ee826ef191d2?w=600&auto=format&fit=crop&q=60') center/cover;
    display: flex; justify-content: center;
    align-items: center; text-align: center; color: white;
}
section.hero h2 { font-size: 28px; letter-spacing: 4px; animation: fadeIn 1s ease; }
section.hero p { margin-top: 10px; font-size: 12px; letter-spacing: 2px; }

.search-box {
    display: flex; flex-direction: column;
    gap: 10px; padding: 30px 20px;
}
.search-box input { padding: 12px; border: 1px solid #ccc; transition: 0.3s; }
.search-box input:focus { border-color: black; outline: none; }
.search-box button {
    padding: 12px; background: black; color: white;
    border: none; cursor: pointer; transition: 0.3s;
}
.search-box button:hover { background: #ddd; color: black; }

.container {
    display: flex; flex-direction: column;
    gap: 30px; padding: 20px;
}

aside { border-right: 1px solid #eee; padding-right: 20px; }
aside h3 { font-size: 14px; letter-spacing: 2px; margin-bottom: 15px; }
aside p { font-size: 13px; margin: 5px 0; }
aside label { display: block; margin: 8px 0; cursor: pointer; }
aside input[type="checkbox"] { accent-color: black; }

main { display: grid; grid-template-columns: 1fr; gap: 40px; }
main h2, main table { grid-column: 1 / -1; }

.card { text-align: center; animation: fadeIn 0.8s ease; }
.card img { width: 100%; height: 250px; object-fit: cover; transition: 0.4s; }
.card img:hover { transform: scale(1.05); }
.card h3 { margin-top: 10px; font-size: 13px; letter-spacing: 1px; }
.card p { font-size: 12px; color: #555; }

#newArrivalsContainer { display: contents; }

.arrival-no-photo {
    width: 100%;
    height: 250px;
    background: #f3f3f3;
    border: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #bbb;
    font-size: 42px;
}

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px; border: 1px solid #eee; text-align: center; }
tr:nth-child(even) { background: #f7f7f7; }

footer {
    padding: 40px 20px; border-top: 1px solid #eee;
    display: flex; flex-direction: column; gap: 20px;
}
footer h4 { font-size: 12px; letter-spacing: 2px; }
footer p { font-size: 12px; color: #666; }

/* ── INVENTORY SECTION ── */
.inventory-section {
    padding: 40px 20px 60px;
    border-top: 1px solid #eee;
    background: #fcfcfc;
}
.inventory-wrapper { max-width: 1200px; margin: 0 auto; }
.inventory-header { margin-bottom: 30px; text-align: center; }
.inventory-header h2 { font-size: 24px; letter-spacing: 3px; margin-bottom: 10px; }
.inventory-header p { color: #666; font-size: 13px; letter-spacing: 1px; }

.inventory-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
}

.panel { background: white; border: 1px solid #eee; padding: 20px; }
.panel h3 { font-size: 14px; letter-spacing: 2px; margin-bottom: 15px; }

.inventory-form {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
}
.inventory-form input,
.inventory-form select {
    width: 100%; padding: 12px;
    border: 1px solid #ccc; font-size: 13px;
}
.inventory-form input:focus,
.inventory-form select:focus { outline: none; border-color: #111; }

/* ── PHOTO UPLOAD ── */
.photo-upload-area {
    border: 2px dashed #ccc;
    padding: 0;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.3s, background 0.3s;
    position: relative;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    overflow: hidden;
}
.photo-upload-area:hover {
    border-color: #111;
    background: #fafafa;
}
.photo-upload-area.has-image {
    border-style: solid;
    border-color: #111;
    padding: 0;
}
.photo-upload-area.dragover {
    border-color: #111;
    background: #f5f5f5;
}
#photoInput { display: none; }

.upload-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 24px;
    pointer-events: none;
}
.upload-icon {
    font-size: 32px;
    line-height: 1;
}
.upload-placeholder span {
    font-size: 12px;
    letter-spacing: 1px;
    color: #888;
}
.upload-placeholder small {
    font-size: 11px;
    color: #bbb;
}

/* Preview image */
#photoPreviewWrap {
    width: 100%;
    position: relative;
    display: none;
}
#photoPreviewWrap img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
}
.photo-remove-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    transition: background 0.2s;
    z-index: 5;
}
.photo-remove-btn:hover { background: #b00020; }

.photo-change-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 11px;
    letter-spacing: 1px;
    text-align: center;
    padding: 8px;
    opacity: 0;
    transition: opacity 0.2s;
}
.photo-upload-area:hover .photo-change-overlay { opacity: 1; }

/* Thumbnail in table */
.tbl-thumb {
    width: 44px; height: 44px;
    object-fit: cover;
    border: 1px solid #eee;
    display: block;
    margin: 0 auto;
}
.tbl-no-photo {
    width: 44px; height: 44px;
    background: #f3f3f3;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto;
    font-size: 18px;
    color: #ccc;
    border: 1px solid #eee;
}

/* ── REST ── */
.form-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.inventory-btn {
    padding: 12px 16px; background: #111; color: white;
    border: none; cursor: pointer; font-size: 12px;
    letter-spacing: 1px; transition: 0.3s;
}
.inventory-btn:hover { opacity: 0.85; }
.inventory-btn.secondary { background: #e9e9e9; color: #111; }

.error-box { min-height: 18px; font-size: 12px; color: #b00020; }
.field-error { font-size: 11px; color: #b00020; margin-top: -6px; }

.tools-bar {
    display: grid; grid-template-columns: 1fr;
    gap: 12px; margin-bottom: 18px;
}

.stats-grid {
    display: grid; grid-template-columns: repeat(1, 1fr);
    gap: 12px; margin-bottom: 20px;
}
.stat-card { border: 1px solid #eee; padding: 16px; background: #fff; }
.stat-card h4 { font-size: 12px; letter-spacing: 1px; color: #666; margin-bottom: 8px; }
.stat-card p { font-size: 20px; }

.inventory-table-wrap { overflow-x: auto; }
.inventory-table th, .inventory-table td { white-space: nowrap; }

.action-btn {
    padding: 8px 10px; border: 1px solid #111;
    background: white; cursor: pointer;
    font-size: 11px; margin: 0 3px;
}
.action-btn.delete { border-color: #b00020; color: #b00020; }
.empty-state { text-align: center; color: #777; font-size: 13px; padding: 16px; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
}

@media(min-width: 768px) {
    .search-box { flex-direction: row; justify-content: center; }
    .search-box input { width: 300px; }
    .container { flex-direction: row; }
    aside { width: 25%; }
    main { width: 75%; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
    footer { flex-direction: row; justify-content: space-between; }
    .inventory-grid { grid-template-columns: 380px 1fr; align-items: start; }
    .tools-bar { grid-template-columns: 1fr 220px; }
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
}


.admin-link-badge{
    border:1px solid #111;padding:8px 12px;font-size:11px;letter-spacing:1px;text-decoration:none;color:#111;
}
.page-title{padding:100px 20px 20px;text-align:center;}
.catalog-grid-page{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
    padding:0 20px 50px;
}
.product-card-link{color:inherit;text-decoration:none;display:block}
.product-meta{font-size:11px;color:#777;margin-top:4px;letter-spacing:1px;}
.catalog-toolbar{display:grid;grid-template-columns:1fr;gap:12px;max-width:900px;margin:0 auto 30px;padding:0 20px;}
.detail-wrapper{padding:110px 20px 50px;max-width:1100px;margin:0 auto;}
.detail-grid{display:grid;grid-template-columns:1fr;gap:30px;}
.detail-image{width:100%;height:420px;object-fit:cover;border:1px solid #eee;background:#f5f5f5;}
.detail-no-photo{height:420px;display:flex;align-items:center;justify-content:center;background:#f3f3f3;border:1px solid #eee;font-size:64px;color:#bbb;}
.detail-info h2{font-size:28px;letter-spacing:3px;margin-bottom:12px;}
.detail-info p{font-size:13px;color:#555;margin:10px 0;}
.detail-price{font-size:24px;color:#111 !important;margin:18px 0 !important;}
.detail-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;}
.info-badge{display:inline-block;border:1px solid #111;padding:8px 12px;font-size:11px;letter-spacing:1px;margin-bottom:16px;}
@media(min-width:768px){
    .catalog-toolbar{grid-template-columns:1fr 220px;}
    .detail-grid{grid-template-columns:1fr 1fr;align-items:start;}
}

</style>
</head>
<body>

<header>
    <div class="nav-container">
        <div class="logo">
            <img src="logo.jpg" alt="Second Chance Logo">
            <h1>SECOND CHANCE</h1>
        </div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="katalog.html">CATALOG</a>
            <a href="admin.html" class="admin-link-badge">ADMIN</a>
        </nav>
    </div>
</header>

<section class="detail-wrapper">
    <div class="detail-grid" id="transactionContainer"></div>
</section>

<footer>
    <div>
        <h4>ABOUT</h4>
        <p>PreLoved Luxury System</p>
    </div>
    <div>
        <h4>MENU</h4>
        <p>Home</p>
        <p>Catalog</p>
    </div>
    <div>
        <h4>BELI SEKARANG</h4>
        <p>Lengkapi data transaksi lalu konfirmasi pesananmu.</p>
    </div>
</footer>

<script>

const STORAGE_KEY = 'secondChanceInventory';
const defaultInventory = [
    { id: crypto.randomUUID(), kode:'SC-001', nama:'Saint Laurent Denim', kategori:'JACKET', stok:3, harga:5150000, tanggalMasuk:'2026-04-15', foto:null },
    { id: crypto.randomUUID(), kode:'SC-002', nama:'Loewe Puzzle Bag', kategori:'BAG', stok:7, harga:7395000, tanggalMasuk:'2026-04-16', foto:null },
    { id: crypto.randomUUID(), kode:'SC-003', nama:'Golden Goose Superstar', kategori:'SHOES', stok:2, harga:3450000, tanggalMasuk:'2026-04-18', foto:null }
];
const formatRupiah = v => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v);
const loadInventory = () => {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved || !Array.isArray(saved)) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultInventory));
        return defaultInventory;
    }
    return saved;
};

const inventory = loadInventory();
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const transactionContainer = document.getElementById('transactionContainer');
const item = inventory.find(product => product.id === id);

if(!item){
    transactionContainer.innerHTML = `
        <div class="panel" style="grid-column:1/-1;text-align:center;">
            <h3>Produk tidak ditemukan</h3>
            <p style="margin-top:10px;">Produk yang kamu pilih tidak tersedia untuk transaksi.</p>
            <div class="detail-actions" style="justify-content:center;">
                <a href="katalog.html" class="inventory-btn" style="text-decoration:none;">KEMBALI KE KATALOG</a>
            </div>
        </div>
    `;
} else {
    transactionContainer.innerHTML = `
        <div>
            ${item.foto ? `<img class="detail-image" src="${item.foto}" alt="${item.nama}">` : `<div class="detail-no-photo">📷</div>`}
        </div>
        <div class="detail-info">
            <div class="info-badge">TRANSAKSI</div>
            <h2>${item.nama.toUpperCase()}</h2>
            <p>Kode Produk: ${item.kode}</p>
            <p>Kategori: ${item.kategori}</p>
            <p>Stok Tersedia: ${item.stok}</p>
            <p class="detail-price">${formatRupiah(item.harga)}</p>
            <form id="transactionForm" class="inventory-form" style="margin-top:18px;">
                <input type="text" id="buyerName" placeholder="Nama Lengkap">
                <input type="tel" id="buyerPhone" placeholder="Nomor WhatsApp">
                <textarea id="buyerAddress" placeholder="Alamat Lengkap" style="width:100%;padding:12px;border:1px solid #ccc;font-size:13px;min-height:110px;font-family:inherit;"></textarea>
                <select id="paymentMethod">
                    <option value="">Pilih Metode Pembayaran</option>
                    <option value="Transfer Bank">Transfer Bank</option>
                    <option value="E-Wallet">E-Wallet</option>
                    <option value="COD">COD</option>
                </select>
                <div class="panel" style="padding:14px;background:#fcfcfc;">
                    <h3 style="margin-bottom:10px;">RINGKASAN PESANAN</h3>
                    <p>Produk: ${item.nama}</p>
                    <p>Kode: ${item.kode}</p>
                    <p>Total: ${formatRupiah(item.harga)}</p>
                </div>
                <div id="transactionMessage" class="error-box"></div>
                <div class="detail-actions">
                    <a href="detail.html?id=${encodeURIComponent(item.id)}" class="inventory-btn" style="text-decoration:none;">KEMBALI KE DETAIL</a>
                    <button type="submit" class="inventory-btn secondary">KONFIRMASI PESANAN</button>
                </div>
            </form>
        </div>
    `;

    const form = document.getElementById('transactionForm');
    const message = document.getElementById('transactionMessage');

    form.addEventListener('submit', e => {
        e.preventDefault();
        const buyerName = document.getElementById('buyerName').value.trim();
        const buyerPhone = document.getElementById('buyerPhone').value.trim();
        const buyerAddress = document.getElementById('buyerAddress').value.trim();
        const paymentMethod = document.getElementById('paymentMethod').value;

        if(!buyerName || !buyerPhone || !buyerAddress || !paymentMethod){
            message.textContent = 'Lengkapi semua data transaksi terlebih dahulu.';
            return;
        }

        message.textContent = '';
        const text = `Halo, saya ingin konfirmasi pesanan.%0A%0ANama: ${encodeURIComponent(buyerName)}%0AWhatsApp: ${encodeURIComponent(buyerPhone)}%0AAlamat: ${encodeURIComponent(buyerAddress)}%0AProduk: ${encodeURIComponent(item.nama)}%0AKode: ${encodeURIComponent(item.kode)}%0ATotal: ${encodeURIComponent(formatRupiah(item.harga))}%0AMetode Pembayaran: ${encodeURIComponent(paymentMethod)}`;
        window.open(`https://wa.me/6200000000000?text=${text}`, '_blank');
    });
}
</script>
</body>
</html>
